name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download assets from GitHub Release
        run: |
          mkdir -p app/libs
          echo "Downloading FFmpeg Kit AAR..."
          curl -L -o app/libs/ffmpeg-kit-full-7.1.7-arm64-v8a-x86_64.aar https://github.com/vishala5000/promise-video-app/releases/download/assets/ffmpeg-kit-full-7.1.7-arm64-v8a-x86_64.aar
          echo "Downloading font and data..."
          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/font.ttf https://github.com/vishala5000/promise-video-app/releases/download/assets/font.ttf
          curl -L -o app/src/main/assets/data.txt https://github.com/vishala5000/promise-video-app/releases/download/assets/data.txt
          ls -la app/libs/
          ls -la app/src/main/assets/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: promise-video-app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
