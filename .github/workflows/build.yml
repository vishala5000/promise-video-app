name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: DIAGNOSE - Show what files exist
        run: |
          echo "🔍 DIAGNOSING PROJECT STRUCTURE"
          echo "================================"
          echo ""
          echo "📁 Root directory contents:"
          ls -la
          echo ""
          echo "📁 Checking for critical files:"
          echo ""
          
          FILES_TO_CHECK=(
            "settings.gradle.kts"
            "settings.gradle"
            "build.gradle.kts"
            "build.gradle"
            "gradlew"
            "app/build.gradle.kts"
            "app/build.gradle"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/com/vishala/promisevideoapp/MainActivity.kt"
          )
          
          MISSING_FILES=()
          
          for file in "${FILES_TO_CHECK[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ EXISTS: $file"
            else
              echo "❌ MISSING: $file"
              MISSING_FILES+=("$file")
            fi
          done
          
          echo ""
          echo "================================"
          echo "📊 SUMMARY:"
          echo "Total files checked: ${#FILES_TO_CHECK[@]}"
          echo "Missing files: ${#MISSING_FILES[@]}"
          
          if [ ${#MISSING_FILES[@]} -gt 0 ]; then
            echo ""
            echo "❌ CRITICAL FILES MISSING:"
            for file in "${MISSING_FILES[@]}"; do
              echo "  - $file"
            done
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create complete project structure if missing
        run: |
          echo "🔧 Ensuring complete project structure..."
          
          # Create settings.gradle.kts if missing
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "Creating settings.gradle.kts..."
            cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          rootProject.name = "promise-video-app"
          include(":app")
          EOF
          fi
          
          # Create root build.gradle.kts if missing
          if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
            echo "Creating root build.gradle.kts..."
            cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF
          fi
          
          # Create gradle.properties if missing
          if [ ! -f "gradle.properties" ]; then
            echo "Creating gradle.properties..."
            cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          fi
          
          echo "✅ Project structure complete"

      - name: Create Gradle Wrapper
        run: |
          echo "🔧 Setting up Gradle wrapper..."
          
          mkdir -p gradle/wrapper
          
          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          fi
          
          if [ ! -f "gradlew" ]; then
            curl -s -o gradlew https://raw.githubusercontent.com/gradle/gradle/master/gradlew
            chmod +x gradlew
          fi
          
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            curl -s -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar
          fi
          
          echo "✅ Gradle wrapper ready"

      - name: Download FFmpeg AAR
        run: |
          mkdir -p app/libs
          echo "Downloading FFmpeg Kit AAR..."
          curl -L -o app/libs/ffmpeg-kit-full-7.1.7-arm64-v8a-x86_64.aar https://github.com/vishala5000/promise-video-app/releases/download/assets/ffmpeg-kit-full-7.1.7-arm64-v8a-x86_64.aar
          ls -lh app/libs/

      - name: Build Debug APK
        run: |
          echo "🔨 Building APK..."
          echo "=========================================="
          ./gradlew clean assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          BUILD_EXIT_CODE=$?
          echo "=========================================="
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ BUILD FAILED!"
            echo ""
            echo "Last 200 lines of build output:"
            tail -n 200 build.log
            exit 1
          fi
          
          echo "✅ Build completed"

      - name: Find and Upload APK
        run: |
          echo "🔍 Searching for APK..."
          find . -name "*.apk" -type f
          
          APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ No APK found!"
            echo ""
            echo "Contents of app/build:"
            find app/build -type f 2>/dev/null || echo "No app/build directory"
            exit 1
          fi
          
          echo "✅ Found APK: $APK_PATH"
          mkdir -p apk-upload
          cp "$APK_PATH" apk-upload/app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: promise-video-app-apk
          path: apk-upload/app.apk
          if-no-files-found: error
