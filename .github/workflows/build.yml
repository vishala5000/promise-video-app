name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify project structure
        run: |
          echo "📁 Checking project structure..."
          ls -la
          echo ""
          echo "📁 Checking app directory..."
          ls -la app/
          echo ""
          echo "📁 Checking if gradlew exists..."
          if [ -f "gradlew" ]; then
            echo "✅ gradlew exists"
            ls -la gradlew
          else
            echo "❌ gradlew NOT FOUND - this is the problem!"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download assets from GitHub Release
        run: |
          mkdir -p app/libs
          echo "Downloading FFmpeg Kit AAR..."
          curl -L -o app/libs/ffmpeg-kit-full-7.1.7-arm64-v8a-x86_64.aar https://github.com/vishala5000/promise-video-app/releases/download/assets/ffmpeg-kit-full-7.1.7-arm64-v8a-x86_64.aar
          
          if [ ! -f "app/libs/ffmpeg-kit-full-7.1.7-arm64-v8a-x86_64.aar" ]; then
            echo "❌ FFmpeg AAR download failed!"
            exit 1
          fi
          
          echo "✅ FFmpeg AAR downloaded successfully"
          ls -lh app/libs/

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew
          ls -la gradlew

      - name: Build with Gradle (SHOW ALL OUTPUT)
        run: |
          echo "🔨 Starting Gradle build..."
          echo "=========================================="
          ./gradlew clean assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-output.log
          BUILD_EXIT_CODE=$?
          echo "=========================================="
          echo "Build exit code: $BUILD_EXIT_CODE"
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ BUILD FAILED! Showing last 100 lines of output:"
            tail -n 100 gradle-output.log
            exit 1
          fi

      - name: Verify APK was created
        run: |
          echo "🔍 Searching for APK files..."
          find . -name "*.apk" -type f
          
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "✅ APK found at expected location"
            ls -lh app/build/outputs/apk/release/
          else
            echo "❌ APK not found at expected location!"
            echo "Searching entire workspace for any APK..."
            find . -name "*.apk" -type f || echo "No APK files found anywhere!"
            exit 1
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: promise-video-app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
