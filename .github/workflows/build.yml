name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download assets from GitHub Release
        run: |
          mkdir -p app/libs
          echo "Downloading FFmpeg Kit AAR..."
          curl -L -o app/libs/ffmpeg-kit-full-7.1.7-arm64-v8a-x86_64.aar https://github.com/vishala5000/promise-video-app/releases/download/assets/ffmpeg-kit-full-7.1.7-arm64-v8a-x86_64.aar
          
          mkdir -p app/src/main/assets
          echo "Downloading font and data..."
          curl -L -o app/src/main/assets/font.ttf https://github.com/vishala5000/promise-video-app/releases/download/assets/font.ttf
          curl -L -o app/src/main/assets/data.txt https://github.com/vishala5000/promise-video-app/releases/download/assets/data.txt
          
          echo "✅ Verifying downloaded files:"
          ls -la app/libs/
          ls -la app/src/main/assets/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # Added --stacktrace and --info to show exact errors if the build fails
        run: ./gradlew assembleRelease --stacktrace --info

      - name: Debug APK Output
        # This step will print out exactly what was generated, helping us debug if it still fails
        run: |
          echo "🔍 Searching for generated APKs..."
          find app/build -name "*.apk" || true
          echo "📁 Contents of release directory:"
          ls -la app/build/outputs/apk/release/ || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: promise-video-app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          # CRITICAL FIX: Fail the workflow explicitly if the APK is missing, so we know it didn't silently succeed
          if-no-files-found: error
