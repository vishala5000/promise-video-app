name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download assets from GitHub Release
        run: |
          mkdir -p app/libs
          echo "Downloading FFmpeg Kit AAR..."
          curl -L -o app/libs/ffmpeg-kit-full-7.1.7-arm64-v8a-x86_64.aar https://github.com/vishala5000/promise-video-app/releases/download/assets/ffmpeg-kit-full-7.1.7-arm64-v8a-x86_64.aar
          
          mkdir -p app/src/main/assets
          echo "Downloading font and data..."
          curl -L -o app/src/main/assets/font.ttf https://github.com/vishala5000/promise-video-app/releases/download/assets/font.ttf
          curl -L -o app/src/main/assets/data.txt https://github.com/vishala5000/promise-video-app/releases/download/assets/data.txt
          
          echo "✅ Verifying downloaded files:"
          ls -la app/libs/
          ls -la app/src/main/assets/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # --stacktrace ensures that if it fails, we see the exact Java/Kotlin error
        run: ./gradlew clean assembleRelease --stacktrace

      - name: Debug APK Output (Always Runs)
        # This runs even if the build fails, so we can see exactly what went wrong
        if: always()
        run: |
          echo "🔍 Searching for ALL generated APKs in the entire workspace..."
          find . -type f -name "*.apk"
          
          echo "📁 Full recursive contents of app/build/outputs:"
          ls -laR app/build/outputs/ || echo "outputs directory does not exist!"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: promise-video-app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
