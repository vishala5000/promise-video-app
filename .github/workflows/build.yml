name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          export PATH=$PATH:$PWD/gradle-8.2/bin
          echo "Gradle version:"
          gradle --version

      - name: Create Android Project Structure
        run: |
          echo "🏗️ Creating complete Android project..."
          
          mkdir -p app/src/main/java/com/vishala/promisevideoapp
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/libs
          
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "promise-video-app"
          include(":app")
          EOF
          
          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF
          
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          
          android {
              namespace = "com.vishala.promisevideoapp"
              compileSdk = 34
          
              defaultConfig {
                  applicationId = "com.vishala.promisevideoapp"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
          
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
                  debug {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation(files("libs/ffmpeg-kit-full-7.1.7-arm64-v8a-x86_64.aar"))
          }
          EOF
          
          echo "✅ Project structure created"

      - name: Download FFmpeg AAR
        run: |
          echo "Downloading FFmpeg Kit AAR..."
          curl -L -o app/libs/ffmpeg-kit-full-7.1.7-arm64-v8a-x86_64.aar https://github.com/vishala5000/promise-video-app/releases/download/assets/ffmpeg-kit-full-7.1.7-arm64-v8a-x86_64.aar
          ls -lh app/libs/

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Promise Video App"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create MainActivity.kt
        run: |
          cat > app/src/main/java/com/vishala/promisevideoapp/MainActivity.kt << 'EOF'
          package com.vishala.promisevideoapp
          
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
              }
          }
          EOF

      - name: Create Layout
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Promise Video App"
                  android:textSize="24sp"/>
          </LinearLayout>
          EOF

      - name: Create Resources
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">Promise Video App</string>
          </resources>
          EOF

      - name: Build Debug APK (SHOW FULL OUTPUT)
        run: |
          echo "🔨 Building APK with Gradle..."
          export PATH=$PATH:$PWD/gradle-8.2/bin
          
          echo "=========================================="
          echo "RUNNING: gradle clean assembleDebug"
          echo "=========================================="
          
          gradle clean assembleDebug --no-daemon --stacktrace 2>&1
          BUILD_EXIT_CODE=$?
          
          echo "=========================================="
          echo "Build exit code: $BUILD_EXIT_CODE"
          echo "=========================================="
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ BUILD FAILED!"
            exit 1
          fi
          
          echo "✅ Build completed successfully"

      - name: Find and Upload APK
        run: |
          echo "🔍 Searching for APK files..."
          echo ""
          echo "All APK files in workspace:"
          find . -name "*.apk" -type f -exec ls -lh {} \;
          echo ""
          
          echo "Contents of app/build/outputs:"
          find app/build/outputs -type f 2>/dev/null || echo "No outputs directory"
          echo ""
          
          APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ No APK found!"
            echo ""
            echo "Full directory tree of app/build:"
            find app/build -type f 2>/dev/null || echo "No app/build directory"
            exit 1
          fi
          
          echo "✅ Found APK: $APK_PATH"
          mkdir -p apk-upload
          cp "$APK_PATH" apk-upload/app.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: promise-video-app-apk
          path: apk-upload/app.apk
          if-no-files-found: error
